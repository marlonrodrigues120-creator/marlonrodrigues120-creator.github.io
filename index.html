/* Layout: sticky slim bar, left-aligned hero with an oversized name that rises line by line, skills marquee, projects grid (first card featured) that opens into a full-page detail, about + skills, and a resume reader that slides over from the right. */
:root{

  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0D12; --surface:#151720; --fg:#EDEEF5; --muted:#9A9EB3; --line:#262938;
    --accent:#8F8CFF; --accent-fg:#0C0D12; --accent-soft:#23234D; --ok:#3DD598;
    --glow:.34; --shadow:0 1px 0 rgba(255,255,255,.03),0 24px 48px -28px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0D12; --surface:#151720; --fg:#EDEEF5; --muted:#9A9EB3; --line:#262938;
  --accent:#8F8CFF; --accent-fg:#0C0D12; --accent-soft:#23234D; --ok:#3DD598;
  --glow:.34; --shadow:0 1px 0 rgba(255,255,255,.03),0 24px 48px -28px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.05}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .25s,transform .4s var(--ease)}

.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:99px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .35s var(--ease),background .25s,color .25s,box-shadow .35s}

/* hero */

.marq{overflow:hidden;border-block:1px solid var(--line);background:var(--surface);padding-block:14px}
.marq-track{display:flex;width:max-content;animation:marq 34s linear infinite}
.marq:hover .marq-track{animation-play-state:paused}
.marq span{display:inline-flex;align-items:center;gap:26px;padding-right:26px;font-family:var(--f-display);font-size:1.35rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap}

/* sections */

.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* reveal: content is always visible, it only slides into place */
.rv{transform:translateY(32px);transition:transform .9s var(--ease)}
.rv.in{transform:none}

/* keyframes */
@keyframes rise{from{transform:translateY(108%)}to{transform:none}}
@keyframes rise2{from{transform:translateY(22px)}to{transform:none}}
@keyframes spin{to{rotate:360deg}}

/* projects */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .6s var(--ease),border-color .3s;animation:pop .7s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms)}
.card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%)}
.card:hover{transform:translateY(-6px);border-color:var(--accent)}
.card:hover::before{opacity:1}

  radial-gradient(70% 90% at 20% 15%,hsl(var(--h) 85% 62%),transparent 62%),

.art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}

}
@media (max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
.empty{border:1px dashed var(--line);border-radius:20px;padding:44px 24px;text-align:center;color:var(--muted)}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;overscroll-behavior:contain;animation:sheetin .6s var(--ease) both}

.sheet h1{font-size:clamp(2.4rem,7vw,5rem);font-weight:700;margin:14px 0 18px;letter-spacing:-.04em}
.sheet .cover{border-radius:22px;aspect-ratio:16/9;margin-block:26px;border:1px solid var(--line)}
.sheet .body{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;align-items:start}
.sheet .desc{font-size:1.12rem;white-space:pre-line;max-width:62ch}
.facts{display:grid;gap:16px;border-top:1px solid var(--line);padding-top:16px}
.facts div{display:grid;gap:2px}
.pn{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-top:56px;border-top:1px solid var(--line);padding-top:24px}
.stag>*{animation:rise2 .7s var(--ease) both;animation-delay:calc(var(--i,0)*80ms + 120ms)}
@media (max-width:760px){.sheet .body{grid-template-columns:minmax(0,1fr)}}
::view-transition-group(pcover){animation-duration:.6s;animation-timing-function:var(--ease)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(28px,6vw,80px)}
.about p.big{font-family:var(--f-display);font-size:clamp(1.35rem,2.6vw,2rem);line-height:1.3;letter-spacing:-.02em;white-space:pre-line}
.skills{display:grid;gap:22px;align-content:start}
.skills h4{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills span{padding:6px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;transition:background .25s,color .25s,transform .35s var(--ease)}

/* resume teaser */
.rs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:clamp(24px,5vw,64px);align-items:center}

.rs .stack i{position:absolute;inset:0;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .7s var(--ease)}
.rs .stack i:nth-child(1){transform:rotate(-6deg) translate(-14px,6px)}
.rs .stack i:nth-child(2){transform:rotate(4deg) translate(12px,2px)}
.rs .stack:hover i:nth-child(1){transform:rotate(-12deg) translate(-34px,10px)}

.rs .stack:hover i:nth-child(3){transform:translateY(-8px)}
.rs .stack i:nth-child(3){display:flex;flex-direction:column;gap:9px;padding:26px 24px;text-align:left}
.rs .stack b{display:block;height:9px;border-radius:5px;background:var(--line)}
.rs .stack b.a{background:var(--accent);width:46%;height:12px}
.rs .stack b.w{width:70%}.rs .stack b.s{width:40%}
.rs h2{font-size:clamp(2rem,5vw,3.6rem);margin-bottom:16px}
@media (max-width:820px){.rs{grid-template-columns:minmax(0,1fr)}}

/* resume reader */
.reader{position:fixed;inset:0;z-index:80;display:flex}
.reader .scrim{position:absolute;inset:0;background:rgba(8,9,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein .4s both;border:0;padding:0}
.reader .panel{position:relative;margin-left:auto;width:min(880px,100%);height:100%;background:var(--surface);overflow:auto;overscroll-behavior:contain;animation:slidein .6s var(--ease) both}
.reader .tb{position:sticky;top:0;z-index:3;display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.reader .tb .r{display:flex;gap:10px;flex-wrap:wrap}
.paper{padding:clamp(24px,5vw,56px);padding-left:max(clamp(24px,5vw,56px),env(safe-area-inset-left,0px));padding-right:max(clamp(24px,5vw,56px),env(safe-area-inset-right,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));display:grid;gap:34px}
.paper>*{animation:rise2 .7s var(--ease) both;animation-delay:calc(var(--i,0)*80ms + 150ms);min-width:0}
.paper h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.04em}
.paper .cts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;color:var(--muted);font-size:.95rem}
.paper h2{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.paper h2::after{content:"";height:1px;flex:1;background:var(--line)}
.tl{display:grid;gap:26px;border-left:1px solid var(--line);margin-left:4px;padding-left:24px}
.tl article{position:relative}
.tl article::before{content:"";position:absolute;left:-30px;top:.5em;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl h3{font-size:1.2rem}
.tl .row{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);margin:3px 0 8px;font-size:.92rem}
.tl ul{margin:0;padding-left:18px;display:grid;gap:4px}
.lang{display:flex;flex-wrap:wrap;gap:8px 26px}
.lang div{display:flex;gap:8px;align-items:baseline}

/* footer */
.foot{border-top:1px solid var(--line);padding-block:clamp(48px,7vw,88px) 40px}
.foot h2{font-size:clamp(2.4rem,8vw,6.5rem);letter-spacing:-.05em;font-weight:700}
.foot h2 em{font-style:normal;color:var(--accent)}
.mail{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
.mail code{font-family:var(--f-mono);font-size:1rem;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);user-select:all;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:34px}
.links a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;transition:border-color .25s,color .25s}
.links a:hover{color:var(--accent);border-color:var(--accent)}
.copy{margin-top:56px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

/* edit mode */
.authbtn{margin-left:6px}.fab{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.etools{position:fixed;z-index:75;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;border-radius:22px;background:var(--fg);color:var(--bg);box-shadow:0 20px 50px -18px rgba(0,0,0,.6);animation:rise2 .5s var(--ease) both}
.etools .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.etools .btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.etools .btn:hover{box-shadow:none}
.etools .btn[disabled]{opacity:.5;cursor:default;transform:none}
.dirty{width:8px;height:8px;border-radius:50%;background:#FF6A3D;display:inline-block}

/* ---------- overlays + routing ---------- */
function vt(fn) { fn(); }

/* navegação: define o hash e abre direto, sem depender do evento hashchange */
function goTo(h) {
  var isView = h === "curriculo" || h.indexOf("projeto-") === 0;
  try { location.hash = h; } catch (e) { /* ignore */ }
  route();
  if (isView) return;
  var el = h && h !== "inicio" ? document.getElementById(h) : null;
  if (el) el.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
  else window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
}

function projectSheet(id) {
  var i = S.projects.findIndex(function (p) { return p.id === id; });
  var p = S.projects[i];
  var n = S.projects.length;
  var url = safeUrl(p.link);
  var tags = (p.tags || []).map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("");
  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Projeto ' + esc(p.title) + '">' +
    '<div class="top"><button class="btn ghost sm" data-act="close">← Voltar</button><span class="mono muted">' + (i + 1) + " / " + n + "</span></div>" +
    '<div class="in"><div class="stag"><div class="mono muted">' + esc(p.year) + (p.role ? " · " + esc(p.role) : "") + "</div>" +
    "<h1>" + esc(p.title) + '</h1><div class="tags">' + tags + "</div></div>" +
    '<div class="cover">' + coverHtml(p) + "</div>" +
    '<div class="body stag"><p class="desc">' + esc(p.description || p.summary) + "</p>" +
    '<div class="facts"><div><span class="mono muted">Papel</span><span>' + esc(p.role || "—") + "</span></div>" +
    '<div><span class="mono muted">Ano</span><span>' + esc(p.year || "—") + "</span></div>" +
    (url ? '<a class="btn accent" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Ver projeto ' + ARROWUP.replace("<svg", "<svg") + "</a>" : "") +
    "</div></div>" +
    ((p.challenge || p.solution || p.result) ? '<div class="case stag">' +
      [["Desafio", p.challenge], ["Solução", p.solution], ["Resultado", p.result]].filter(function (x) { return x[1]; }).map(function (x) { return '<div><span class="mono muted">' + x[0] + "</span><p>" + esc(x[1]) + "</p></div>"; }).join("") + "</div>" : "") +
    ((p.gallery || []).length ? '<div class="gal">' + p.gallery.map(function (g) { return '<img src="' + esc(g) + '" alt="Imagem do projeto ' + esc(p.title) + '" loading="lazy">'; }).join("") + "</div>" : "") +
    (n > 1 ? '<div class="pn"><button class="btn ghost" data-nav="' + S.projects[(i - 1 + n) % n].id + '">← ' + esc(S.projects[(i - 1 + n) % n].title) + '</button><button class="btn ghost" data-nav="' + S.projects[(i + 1) % n].id + '">' + esc(S.projects[(i + 1) % n].title) + " →</button></div>" : "") +
    "</div></div>";
}

function readerHtml() {
  var P = S.profile, R = S.resume, n = 0;
  var step = function () { return 'style="--i:' + (n++) + '"'; };
  var cts = [P.email, P.location].concat((P.links || []).map(function (l) { return safeUrl(l.url) ? l.label : ""; })).filter(Boolean)
    .map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("");
  var exp = (R.experience || []).map(function (e) {
    return "<article><h3>" + esc(e.role) + '</h3><div class="row"><span>' + esc(e.org) + "</span><span>" + esc(e.period) + "</span></div>" +
      ((e.bullets || []).length ? "<ul>" + e.bullets.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul>" : "") + "</article>";
  }).join("");
  var edu = (R.education || []).map(function (e) {
    return "<article><h3>" + esc(e.title) + '</h3><div class="row"><span>' + esc(e.org) + "</span><span>" + esc(e.period) + "</span></div></article>";
  }).join("");
  var sk = (R.skills || []).map(function (g) {
    return '<div style="margin-bottom:14px"><div class="mono muted" style="margin-bottom:8px">' + esc(g.group) + '</div><div class="pills">' + (g.items || []).map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div></div>";
  }).join("");
  var lg = (R.languages || []).map(function (l) { return "<div><b>" + esc(l.name) + '</b><span class="muted">' + esc(l.level) + "</span></div>"; }).join("");
  return '<div class="reader" role="dialog" aria-modal="true" aria-label="Currículo">' +
    '<button class="scrim" data-act="close" aria-label="Fechar currículo"></button>' +
    '<div class="panel"><div class="tb"><span class="mono muted">Currículo completo</span>' +
    '<div class="r">' + (R.pdf ? '<button class="btn ghost sm" data-act="dl">Baixar PDF</button>' : "") + '<button class="btn sm" data-act="close">Fechar</button></div></div>' +
    '<div class="paper" id="paper">' +
    "<div " + step() + "><h1>" + esc(P.name) + '</h1><p class="role" style="margin-top:10px">' + esc(P.role) + '</p><div class="cts">' + cts + "</div></div>" +
    (R.summary ? "<div " + step() + "><h2>Resumo</h2><p>" + esc(R.summary) + "</p></div>" : "") +
    (exp ? "<div " + step() + "><h2>Experiência</h2><div class=\"tl\">" + exp + "</div></div>" : "") +
    (edu ? "<div " + step() + "><h2>Formação</h2><div class=\"tl\">" + edu + "</div></div>" : "") +
    (sk ? "<div " + step() + "><h2>Habilidades</h2>" + sk + "</div>" : "") +
    (lg ? "<div " + step() + "><h2>Idiomas</h2><div class=\"lang\">" + lg + "</div></div>" : "") +
    "</div></div></div>";
}

function route() {

  if (!(window.claude && claude.use)) {
    var a = document.createElement("a"); a.href = pdf.data; a.download = pdf.name || "curriculo-marlon-rodrigues.pdf";
    document.body.appendChild(a); a.click(); a.remove(); return;
  }
  var dl = await claude.use("downloads");
  if (!dl) { toast("Download indisponível nesta visualização."); return; }
  try {
    var b64 = pdf.data.split(",")[1] || "";
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    await dl.save({ filename: pdf.name || "curriculo.pdf", data: bytes });
    toast("Currículo salvo.");

    if (e && e.code !== "declined") toast("Não foi possível baixar o arquivo.");

}

/* embaralha o texto uma vez, quando o título aparece */
function scramble(el) {
  if (reduced || el._sc) return;
  el._sc = true;
  var final = el.textContent, chars = "abcdefghijklmnopqrstuvwxyzáéíóúãõç", t0 = performance.now(), dur = 700;
  (function tick(now) {
    var k = Math.min(1, (now - t0) / dur), out = "";
    for (var i = 0; i < final.length; i++) {
      var ch = final.charAt(i);
      out += (ch === " " || i < final.length * k) ? ch : chars.charAt(Math.floor(Math.random() * chars.length));
    }
    el.textContent = out;
    if (k < 1) requestAnimationFrame(tick); else el.textContent = final;
  })(t0);
}

    s.style.background = cols[i % cols.length];
    document.body.appendChild(s);
    var ang = Math.random() * 6.283, d = 70 + Math.random() * 130;
    var anim = s.animate([
      { transform: "translate(-50%,-50%) rotate(0deg)", opacity: 1 },
      { transform: "translate(" + (Math.cos(ang) * d - 4) + "px," + (Math.sin(ang) * d + 60) + "px) rotate(" + (Math.random() * 720 - 360) + "deg)", opacity: 0 }
    ], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.1,1)" });
    anim.onfinish = (function (n) { return function () { n.remove(); }; })(s);

}

function fmtProc(a) { return (a || []).map(function (x) { return x.title + " | " + x.desc; }).join("\n"); }
function parseProc(t) { return lines(t).map(function (l) { var h = pipes(l); return { title: h[0] || "", desc: h.slice(1).join(" | ") }; }); }
function fmtTst(a) { return (a || []).map(function (x) { return x.text + " | " + x.name + " | " + x.role; }).join("\n"); }
function parseTst(t) { return lines(t).map(function (l) { var h = pipes(l); return { text: h[0] || "", name: h[1] || "", role: h[2] || "" }; }); }
function sectionsForm() {

var DRAFT = "pf-draft", statMsg = "";
function saveDraft() {
  try { localStorage.setItem(DRAFT, JSON.stringify(S)); } catch (e) { statMsg = "Rascunho grande demais para guardar neste navegador. Publique logo para não perder."; }
}
function clearDraft() { try { localStorage.removeItem(DRAFT); } catch (e) { /* ignore */ } }
function setStat(m) { statMsg = m; var el = $("#estat"); if (el) { el.textContent = m; el.hidden = !m; } }
function changed() {
  dirty = true; saveDraft(); rerender();
  setStat("Alterações ainda não publicadas. Clique em Publicar para salvar de vez.");
}

function edHtml() {
  if (!canEdit) return "";
  if (!editing) return '<button class="btn accent fab" data-act="enter-edit">Editar página</button>';
  return '<div class="etools" role="toolbar" aria-label="Edição"><div class="estat" id="estat" role="status"' + (statMsg ? "" : " hidden") + ">" + esc(statMsg) + "</div>" +
    '<button class="btn sm" data-act="add-p">+ Projeto</button><button class="btn sm" data-act="edit-profile">Perfil</button><button class="btn sm" data-act="edit-resume">Currículo</button><button class="btn sm" data-act="edit-sections">Processo</button>' +

}

function rerender() {
  var root = $("#root"), c = cur, y = savedY;
  root.innerHTML = appHtml();
  root.classList.add("still");
  bindPage();
  $("#ed").innerHTML = edHtml();
  if (c) { cur = ""; route(); savedY = y; }
}

function editAction(a, el) {
  if (!canEdit) return false;
  var id = el.getAttribute("data-id");
  switch (a) {
    case "enter-edit": editing = true; rerender(); return true;
    case "exit-edit": editing = false; rerender(); return true;
    case "add-p": projectForm(""); return true;
    case "edit-p": projectForm(id); return true;
    case "save-p": saveProject(id); return true;
    case "up-p": {
      var i = S.projects.findIndex(function (x) { return x.id === id; });
      if (i > 0) { var t = S.projects[i - 1]; S.projects[i - 1] = S.projects[i]; S.projects[i] = t; changed(); }
      return true;
    }
    case "del-p":
      if (el.getAttribute("data-sure")) {
        S.projects = S.projects.filter(function (x) { return x.id !== id; });
        flt = "Todos"; changed();
      } else {
        el.setAttribute("data-sure", "1"); el.textContent = "Confirmar exclusão?";
        setTimeout(function () { if (el.isConnected) { el.removeAttribute("data-sure"); el.textContent = "Excluir"; } }, 3500);
      }
      return true;
    case "rm-img": pendImg = ""; showPrev(); return true;
    case "rm-gal": pendGal.splice(Number(id), 1); showGal(); return true;
    case "rm-pdf": pendPdf = null; showPdf(); return true;
    case "edit-profile": profileForm(); return true;
    case "save-profile": saveProfile(); return true;
    case "edit-resume": resumeForm(); return true;
    case "save-resume": saveResume(); return true;
    case "close-modal": closeModal(); return true;
    case "edit-sections": sectionsForm(); return true;
    case "save-sections": saveSections(); return true;
    case "publish": publish(); return true;
  }
  return false;
}

document.addEventListener("click", function (e) {
  if (e.target.getAttribute && e.target.getAttribute("data-modal")) closeModal();
});
document.addEventListener("change", async function (e) {
  var t = e.target, f = t.files && t.files[0];
  if (!f) return;
  try {
    if (t.id === "f-img") { pendImg = await toDataURL(f); showPrev(); }
    if (t.id === "f-gal") {
      var fs = Array.prototype.slice.call(t.files).slice(0, Math.max(0, 4 - pendGal.length));
      for (var k = 0; k < fs.length; k++) pendGal.push(await toDataURL(fs[k], 1200));
      t.value = ""; showGal();
    }
    if (t.id === "f-pdf") {
      if (f.size > 4 * 1024 * 1024) { toast("O PDF deve ter até 4 MB."); t.value = ""; return; }
      pendPdf = { name: f.name, data: await readAsDataURL(f) }; showPdf();
    }
  } catch (x) { toast("Não consegui ler esse arquivo."); }
});

/* ---------- publish ---------- */
async function publish() {
  if (!canEdit) { toast("Somente o dono da página pode publicar alterações."); return; }
  if (sb && session) { await publishOnline(); return; }
  var art = window.claude && claude.use ? await claude.use("artifact") : null;
  if (!art) { toast("Publicar não está disponível nesta visualização."); return; }
  var btn = $('[data-act="publish"]');
  if (btn) { btn.disabled = true; btn.textContent = "Publicando…"; }
  try { sessionStorage.setItem("pf-edit", "1"); } catch (e) { /* ignore */ }
  var reset = (document.head.querySelector("style") || {}).textContent ||
    ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var seen = {}, pre = "";
  $$('title, meta[name="claude:viewport-fit-sides"], link[href^="https://fonts."]').forEach(function (n) {
    var o = n.outerHTML; if (!seen[o]) { seen[o] = 1; pre += o; }
  });
  var css = $("#pagecss").textContent, js = $("#appjs").textContent;
  var json = JSON.stringify(S).replace(/</g, "\\u003c");
  var html = "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + reset + "</style></head><body>" +
    pre + '<style id="pagecss">' + css + '</style><div id="root"></div><script id="state" type="application/json">' + json + '<\/script><script id="appjs">' + js + "<\/script></body></html>";
  try {
    await art.publish(html);
    setStat("Publicado.");
  } catch (e) {
    try { sessionStorage.removeItem("pf-edit"); } catch (x) { /* ignore */ }
    if (btn) { btn.disabled = false; btn.textContent = "Publicar"; }
    var c = (e && e.code) || "desconhecido", m = (e && e.message) ? " (" + e.message + ")" : "";
    if (c === "conflict") setStat("Existe uma versão mais nova da página. Ela vai recarregar e o seu rascunho será recuperado. Clique em Publicar de novo.");
    else if (c === "not_writer" || c === "not_granted" || c === "consent_required") setStat("Esta visualização não tem permissão para publicar. Abra o link da página no claude.ai, com a sua conta, e tente de novo. O rascunho fica guardado neste navegador.");
    else if (c === "capability_disabled" || c === "capability_removed" || c === "not_declared") setStat("Publicar não está disponível aqui (código " + c + "). Abra a página pelo link do claude.ai. O rascunho fica guardado neste navegador.");
    else if (c === "too_large") setStat("A página ficou grande demais. Troque imagens grandes por menores e publique de novo.");
    else if (c === "rate_limited") setStat("Muitas publicações seguidas. Espere um minuto e tente de novo.");
    else setStat("Não foi possível publicar (código " + c + ")." + m + " O rascunho fica guardado neste navegador.");
  }
}

  ["lg-email", "lg-pass"].forEach(function (id) { var el = document.getElementById(id); if (el) { el.setAttribute("autocomplete", id === "lg-pass" ? "new-password" : "off"); el.setAttribute("name", "pf-" + id + "-" + Date.now()); } });
  var pw = document.getElementById("lg-pass");

async function doLogin() {
  var err = document.getElementById("lg-err"), btn = $('[data-act="do-login"]');
  var email = val("lg-email"), pass = (document.getElementById("lg-pass") || {}).value || "";
  function fail(m) { if (err) { err.textContent = m; err.hidden = false; } if (btn) { btn.disabled = false; btn.textContent = "Entrar"; } }
  if (!email || !pass) return fail("Informe e-mail e senha.");
  if (btn) { btn.disabled = true; btn.textContent = "Entrando…"; }
  try {
    var r = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) return fail(/invalid/i.test(r.error.message) ? "E-mail ou senha incorretos." : r.error.message);
    session = r.data.session;
    if (!session || session.user.id !== OWNER_ID) { await sb.auth.signOut(); session = null; return fail("Esta conta não tem permissão para editar esta página."); }
    canEdit = true; editing = true; closeModal();
    try { var dr = localStorage.getItem(DRAFT); if (dr && dr !== JSON.stringify(S)) { var o = JSON.parse(dr); if (o && o.projects && o.profile && o.resume) { S = o; dirty = true; statMsg = "Rascunho recuperado: há alterações ainda não publicadas. Clique em Publicar para salvar."; } } } catch (e) { /* ignore */ }
    rerender(); toast("Modo de edição ativado.");
  } catch (e) { fail("Não foi possível entrar agora. Tente de novo."); }
}
async function doLogout() {
  if (dirty && !confirm("Há alterações não publicadas. Elas ficam guardadas como rascunho neste navegador. Sair mesmo assim?")) return;
  try { await sb.auth.signOut(); } catch (e) { /* ignore */ }
  session = null; canEdit = false; editing = false; statMsg = "";
  await loadPublished(); dirty = false; rerender(); toast("Você saiu. A página está só para visualização.");
}
async function loadPublished() {
  if (!sb) return;
  try {
    var r = await fetch(SB_URL + "/storage/v1/object/public/portfolio/" + STATE_FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    var o = await r.json();
    if (o && o.projects && o.profile && o.resume) { S = o; rerender(); }
  } catch (e) { /* mantém o conteúdo embutido na página */ }
}
async function publishOnline() {
  var btn = $('[data-act="publish"]');
  if (btn) { btn.disabled = true; btn.textContent = "Publicando…"; }
  try {
    var blob = new Blob([JSON.stringify(S)], { type: "application/json" });
    var r = await sb.storage.from("portfolio").upload(STATE_FILE, blob, { upsert: true, contentType: "application/json", cacheControl: "0" });
    if (r.error) throw r.error;
    dirty = false; clearDraft(); setStat("Publicado! Todos os visitantes já veem a nova versão."); rerender();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Publicar"; }
    setStat("Não foi possível publicar (" + ((e && e.message) || "erro") + "). O rascunho fica guardado neste navegador.");
  }
}

/* ---------- boot ---------- */
async function init() {
  try { var th = localStorage.getItem("pf-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) { /* ignore */ }
  $("#root").innerHTML = appHtml();
  bindGlobal(); bindPage(); route();
  await loadPublished();
  if (sb) {
    try { session = (await sb.auth.getSession()).data.session; } catch (e) { session = null; }
    canEdit = !!(session && session.user && session.user.id === OWNER_ID);
    sb.auth.onAuthStateChange(function (_ev, s) { session = s; });
    rerender();
  }
  var user = !canEdit && window.claude && claude.use ? await claude.use("user") : null;
  if (user) { try { canEdit = (await user.isOwner()) && (await user.canEdit()); } catch (e) { canEdit = false; } }
  if (canEdit) {
    try {
      var dr = localStorage.getItem(DRAFT);
      if (dr) {
        if (dr === JSON.stringify(S)) clearDraft();
        else { var o = JSON.parse(dr); if (o && o.projects && o.profile && o.resume) { S = o; dirty = true; editing = true; statMsg = "Rascunho recuperado: há alterações ainda não publicadas. Clique em Publicar para salvar."; } }
      }
    } catch (e) { /* ignore */ }
    if (dirty) { flt = "Todos"; }
    try { if (sessionStorage.getItem("pf-edit") === "1") { editing = true; sessionStorage.removeItem("pf-edit"); } } catch (e) { /* ignore */ }
    rerender();
  }
}
init();

/* ---------- hero field (canvas) ---------- */
var fieldTok = 0;
function heroField() {
  var cv = $("#field"), hero = $("#hero");
  if (!cv || !hero) return;
  var tok = ++fieldTok, ctx = cv.getContext("2d");
  var dpr = Math.min(2, window.devicePixelRatio || 1), gap = 34;
  var W = 0, H = 0, cols = 0, rows = 0, mx = -999, my = -999, t0 = performance.now();
  var fg = "#888", acc = "#66f", visible = true, running = false, frame = 0;
  function colors() {
    var cs = getComputedStyle(document.documentElement);
    fg = cs.getPropertyValue("--fg").trim() || fg;
    acc = cs.getPropertyValue("--accent").trim() || acc;
  }
  function size() {
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / gap) + 1; rows = Math.ceil(H / gap) + 1;
  }
  function draw(now) {
    var t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    if (++frame % 40 === 1) colors();
    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        var x = i * gap, y = j * gap;
        var wave = Math.sin(i * 0.35 + t * 0.9) + Math.cos(j * 0.3 - t * 0.7);
        var dx = x - mx, dy = y - my, d = Math.sqrt(dx * dx + dy * dy);
        var push = d < 150 ? 1 - d / 150 : 0;
        var px = x + Math.cos(wave) * 5 + (d > 0 ? dx / d * push * 26 : 0);
        var py = y + Math.sin(wave) * 5 + (d > 0 ? dy / d * push * 26 : 0);
        ctx.globalAlpha = 0.16 + push * 0.8;
        ctx.fillStyle = push > 0.05 ? acc : fg;
        ctx.beginPath(); ctx.arc(px, py, 1 + ((wave + 2) / 4) * 1.2 + push * 2.6, 0, 6.283); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  function loop() {
    if (running) return;
    running = true;
    (function step(now) {
      if (tok !== fieldTok || !visible || document.hidden) { running = false; return; }
      draw(now); requestAnimationFrame(step);
    })(performance.now());
  }
  size(); colors(); draw(performance.now());
  if ("ResizeObserver" in window) {
    var ro = new ResizeObserver(function () { if (tok !== fieldTok) { ro.disconnect(); return; } size(); draw(performance.now()); });
    ro.observe(cv);
  }
  hero.addEventListener("pointermove", function (e) {
    var r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top;
  }, { passive: true });
  hero.addEventListener("pointerleave", function () { mx = -999; my = -999; });
  if (reduced) return;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) loop(); }).observe(cv);
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && tok === fieldTok) loop(); });
  loop();
}

/* ---------- about statement: words light up while scrolling ---------- */
function statementUpdate() {
  var st = $("#statement"); if (!st) return;
  var ws = st.querySelectorAll(".wd"), r = st.getBoundingClientRect(), vh = window.innerHeight;
  var p = Math.max(0, Math.min(1, (vh * 0.85 - r.top) / (r.height + vh * 0.35)));
  var n = Math.round(p * ws.length * 1.1);
  if (st._n === n) return;
  st._n = n;
  for (var i = 0; i < ws.length; i++) ws[i].classList.toggle("lit", i < n);
}

/* ---------- counters ---------- */
function counters() {
  var els = $$("[data-count]");
  if (!els.length || reduced || !("IntersectionObserver" in window)) return;
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (en) {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      var el = en.target, to = Number(el.getAttribute("data-count")) || 0, t0 = performance.now();
      (function step(now) {
        var k = Math.min(1, (now - t0) / 1400);
        el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    });
  }, { threshold: 0.6 });
  els.forEach(function (e) { io.observe(e); });
}

/* ---------- testimonials ---------- */
var tIdx = 0, tTimer = 0, tPause = false;
function goT(i) {
  var box = $("#tst"); if (!box) return;
  var sl = $$(".sl", box); if (!sl.length) return;
  tIdx = (i + sl.length) % sl.length;
  sl.forEach(function (s, k) { s.classList.toggle("on", k === tIdx); });
  $$(".dots button", box).forEach(function (b, k) { b.classList.toggle("on", k === tIdx); });
}
function carouselInit() {
  clearInterval(tTimer);
  var box = $("#tst"); if (!box || $$(".sl", box).length < 2) return;
  tIdx = 0;
  var on = function () { tPause = true; }, off = function () { tPause = false; };
  box.addEventListener("pointerenter", on); box.addEventListener("pointerleave", off);
  box.addEventListener("focusin", on); box.addEventListener("focusout", off);
  tTimer = setInterval(function () { if (!tPause && !reduced && !document.hidden) goT(tIdx + 1); }, 6500);
}

/* ---------- command palette ---------- */
var cpSel = 0;
function paletteItems(q) {
  var go = function (h) { return function () { closePalette(); goTo(h); }; };
  var all = [
    { l: "Início", f: go("inicio") }, { l: "Projetos", f: go("projetos") }, { l: "Sobre", f: go("sobre") },
    { l: "Ver currículo", f: go("curriculo") }, { l: "Contato", f: go("contato") }
  ].concat(S.projects.map(function (p) { return { l: "Projeto: " + p.title, f: go("projeto-" + p.id) }; }))
    .concat([{ l: "Alternar tema claro e escuro", f: function () { closePalette(); toggleTheme(); } }]);
  q = (q || "").toLowerCase();
  return all.filter(function (x) { return !q || x.l.toLowerCase().indexOf(q) > -1; });
}
function paletteRender() {
  var q = $("#cp-q"), l = $("#cp-l"); if (!q || !l) return;
  var items = paletteItems(q.value);
  cpSel = Math.max(0, Math.min(cpSel, items.length - 1));
  l.innerHTML = items.length ? items.map(function (x, i) {
    return '<li class="' + (i === cpSel ? "sel" : "") + '"><button data-cpi="' + i + '">' + esc(x.l) + "</button></li>";
  }).join("") : '<li class="muted" style="padding:12px">Nada encontrado.</li>';
}
function openPalette() {
  $("#cp").innerHTML = '<div class="modal" data-cp="1"><div class="dlg pal" role="dialog" aria-modal="true" aria-label="Busca rápida"><input type="text" id="cp-q" placeholder="Ir para…" autocomplete="off" aria-label="Buscar seção ou projeto"><ul id="cp-l"></ul></div></div>';
  cpSel = 0; paletteRender();
  var q = $("#cp-q"); q.focus();
  q.addEventListener("input", function () { cpSel = 0; paletteRender(); });
  q.addEventListener("keydown", function (e) {
    var items = paletteItems(q.value);
    if (e.key === "ArrowDown") { e.preventDefault(); cpSel = Math.min(items.length - 1, cpSel + 1); paletteRender(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cpSel = Math.max(0, cpSel - 1); paletteRender(); }
    else if (e.key === "Enter" && items[cpSel]) { e.preventDefault(); items[cpSel].f(); }
  });
}
function closePalette() { $("#cp").innerHTML = ""; }

/* ---------- global effects: cursor, tilt, magnet, clicks, shortcuts ---------- */
var curX = 0, curY = 0, ringX = 0, ringY = 0, curRaf = 0;
function ringStep() {
  curRaf = 0;
  var c = $("#cur"); if (!c) return;
  ringX += (curX - ringX) * 0.18; ringY += (curY - ringY) * 0.18;
  c.querySelector("i").style.transform = "translate3d(" + ringX + "px," + ringY + "px,0)";
  if (Math.abs(curX - ringX) + Math.abs(curY - ringY) > 0.4) curRaf = requestAnimationFrame(ringStep);
}
function globalFx() {
  var fine = window.matchMedia && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  document.addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse" || reduced) return;
    var t = e.target;
    var card = t.closest && t.closest(".card");
    if (card) {
      var r = card.getBoundingClientRect();
      card.style.setProperty("--rx", ((0.5 - (e.clientY - r.top) / r.height) * 5).toFixed(2) + "deg");
      card.style.setProperty("--ry", (((e.clientX - r.left) / r.width - 0.5) * 7).toFixed(2) + "deg");
    }
    var m = t.closest && t.closest(".mag");
    if (m) {
      var b = m.getBoundingClientRect();
      m.style.setProperty("--tx", ((e.clientX - b.left - b.width / 2) * 0.22).toFixed(1) + "px");
      m.style.setProperty("--ty", ((e.clientY - b.top - b.height / 2) * 0.3).toFixed(1) + "px");
    }
    var c = $("#cur");
    if (fine && c) {
      c.classList.add("on");
      curX = e.clientX; curY = e.clientY;
      var lk = t.closest && t.closest("a,button,[data-svc],.chip,input,textarea,label");
      c.classList.toggle("oncard", !!card);
      c.classList.toggle("link", !card && !!lk);
      c.querySelector("span").style.transform = "translate3d(" + curX + "px," + curY + "px,0)";
      if (!curRaf) curRaf = requestAnimationFrame(ringStep);
    }
  }, { passive: true });
  document.addEventListener("pointerout", function (e) {
    var t = e.target, rt = e.relatedTarget;
    var card = t.closest && t.closest(".card");
    if (card && !(rt && card.contains(rt))) { card.style.removeProperty("--rx"); card.style.removeProperty("--ry"); }
    var m = t.closest && t.closest(".mag");
    if (m && !(rt && m.contains(rt))) { m.style.removeProperty("--tx"); m.style.removeProperty("--ty"); }
    if (!rt) { var c = $("#cur"); if (c) c.classList.remove("on"); }
  });
  document.addEventListener("click", function (e) {
    var t = e.target;
    var tb = t.closest("[data-t]");
    if (tb) { var v = tb.getAttribute("data-t"); goT(v === "prev" ? tIdx - 1 : v === "next" ? tIdx + 1 : Number(v)); return; }
    var s = t.closest("[data-svc]");
    if (s) {
      var box = s.parentNode, open = !box.classList.contains("open");
      $$(".svc.open").forEach(function (x) { x.classList.remove("open"); x.querySelector("[data-svc]").setAttribute("aria-expanded", "false"); });
      if (open) { box.classList.add("open"); s.setAttribute("aria-expanded", "true"); }
      return;
    }
    var ci = t.closest("[data-cpi]");
    if (ci) { var it = paletteItems($("#cp-q").value)[Number(ci.getAttribute("data-cpi"))]; if (it) it.f(); return; }
    if (t.getAttribute && t.getAttribute("data-cp")) closePalette();
  });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if ($("#cp").firstChild) closePalette(); else openPalette(); }
  });
}
</script></body></html>
